<!doctype html>
<html lang="de">
<head>

<title>Paul und Jesse Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .hud { position: fixed; top: 12px; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .hud .name { font-size: 20px; font-weight: bold; }
  .hud .keys { font-size: 13px; font-weight: normal; opacity: .85; margin-left: 6px; }
  .bar { position: relative; width: 240px; height: 20px; margin-top: 4px; background: #000a; border: 2px solid #fff; border-radius: 6px; overflow: hidden; }
  .fill { position: absolute; inset: 0; width: 100%; background: #3ecf4a; transition: width .15s, background .3s; }
  .hpnum { position: absolute; inset: 0; text-align: center; font-size: 14px; font-weight: bold; line-height: 20px; }

  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  .hurt { position: fixed; top: 0; bottom: 0; width: 50%; pointer-events: none; opacity: 0; transition: opacity .35s;
          background: radial-gradient(ellipse at center, transparent 45%, rgba(220,0,0,.75) 100%); }
  #divider { position: fixed; top: 0; bottom: 0; left: calc(50% - 2px); width: 4px; background: #222; }
  #team { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: #000a; color: #fff; padding: 6px 14px;
          border-radius: 8px; font-size: 16px; white-space: nowrap; pointer-events: none; }
  #msg { position: fixed; top: 34%; width: 100%; text-align: center; color: #fff; font-size: 38px; font-weight: bold;
         text-shadow: 0 2px 6px #000; pointer-events: none; opacity: 0; transition: opacity .4s; }

</div>

  <div class="bar"><div class="fill"></div><div class="hpnum">100</div></div>
</div>
<div id="team">Team-Rang: <b id="rank">Bauer</b> · Besiegte Gegner: <b id="kills">0</b></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ================= Grundaufbau =================
const WORLD = 150;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

const scene = new THREE.Scene();
const SKY = 0x9fd3f0;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 70, 240);
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x4a6b2a, 1.0));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(70, 110, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, far: 350 });
scene.add(sun);

// Zufall mit festem Startwert, damit die Welt immer gleich aussieht
let seed = 42;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const noise3 = (x, y, z) => { const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453; return s - Math.floor(s); };

const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, metalness: 0, ...extra });
const metal = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.8 });
function mesh(geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ================= Hindernisse =================
const circles = [];
const boxes = [];
function blocked(x, z, r) {
  if (Math.abs(x) > WORLD - 2 || Math.abs(z) > WORLD - 2) return true;
  for (const c of circles) {
    const dx = x - c.x, dz = z - c.z;
    if (dx * dx + dz * dz < (c.r + r) ** 2) return true;
  }
  for (const b of boxes) {
    if (x + r > b.x1 && x - r < b.x2 && z + r > b.z1 && z - r < b.z2) return true;
  }
  return false;
}
function move(obj, dx, dz, r) {
  const p = obj.position;
  if (!blocked(p.x + dx, p.z, r)) p.x += dx;
  if (!blocked(p.x, p.z + dz, r)) p.z += dz;
}

// ================= Boden und Weg =================
{
  const geo = new THREE.PlaneGeometry(WORLD * 2, WORLD * 2, 150, 150);
  const colors = [];
  const c = new THREE.Color();
  for (let i = 0; i < geo.attributes.position.count; i++) {
    c.setHSL(0.27 + rand() * 0.04, 0.5, 0.30 + rand() * 0.06);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const ground = mesh(geo, std(0xffffff, { vertexColors: true }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const path = mesh(new THREE.PlaneGeometry(6, 140), std(0xb89a62));
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.02;
  scene.add(path);
}

// ================= Burgen =================
const stone = std(0xa39e93, { roughness: 0.95 });
const merlonGeo = new THREE.BoxGeometry(1, 0.8, 1);
function addWall(x1, z1, x2, z2) {
  const w = Math.max(Math.abs(x2 - x1), 1), d = Math.max(Math.abs(z2 - z1), 1);
  const cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
  scene.add(mesh(new THREE.BoxGeometry(w, 5, d), stone, cx, 2.5, cz));
  const len = Math.max(w, d);
  for (let t = -len / 2 + 0.5; t <= len / 2 - 0.5; t += 2) {
    scene.add(mesh(merlonGeo, stone, w > d ? cx + t : cx, 5.4, w > d ? cz : cz + t));
  }
  boxes.push({ x1: cx - w / 2, x2: cx + w / 2, z1: cz - d / 2, z2: cz + d / 2 });
}
function addCastle(cx, cz, gateDir, color) {
  const roof = std(color, { roughness: 0.7 });
  const gz = cz + gateDir * 10, bz = cz - gateDir * 10;
  addWall(cx - 10, bz, cx + 10, bz);
  addWall(cx - 10, cz - 10, cx - 10, cz + 10);
  addWall(cx + 10, cz - 10, cx + 10, cz + 10);
  addWall(cx - 10, gz, cx - 3, gz);   // Tor in der Mitte
  addWall(cx + 3, gz, cx + 10, gz);
  for (const [tx, tz] of [[-10, -10], [10, -10], [-10, 10], [10, 10]]) {
    scene.add(mesh(new THREE.CylinderGeometry(2, 2.2, 8, 16), stone, cx + tx, 4, cz + tz));
    scene.add(mesh(new THREE.ConeGeometry(2.7, 3.5, 16), roof, cx + tx, 9.75, cz + tz));
    circles.push({ x: cx + tx, z: cz + tz, r: 2.2 });
  }
  scene.add(mesh(new THREE.BoxGeometry(6, 9, 6), stone, cx, 4.5, cz));
  const keepRoof = mesh(new THREE.ConeGeometry(5, 4, 4), roof, cx, 11, cz);
  keepRoof.rotation.y = Math.PI / 4;
  scene.add(keepRoof);
  scene.add(mesh(new THREE.CylinderGeometry(0.08, 0.08, 4), std(0x5d4037), cx, 15, cz));
  scene.add(mesh(new THREE.PlaneGeometry(2, 1.2), std(color, { side: THREE.DoubleSide }), cx + 1, 16.3, cz));
  boxes.push({ x1: cx - 3, x2: cx + 3, z1: cz - 3, z2: cz + 3 });
}
const HOME = { x: 0, z: 80 };
addCastle(HOME.x, HOME.z, -1, 0x1e63d6);   // eure Burg (blau)
addCastle(0, -80, 1, 0xc62828);            // feindliche Burg (rot)

// ================= Berge mit Pass in der Mitte =================
for (const side of [-1, 1]) {
  for (let i = 0; i < 6; i++) {
    const r = 14 + rand() * 6, h = 28 + rand() * 22;
    const x = side * (26 + i * 22), z = (rand() - 0.5) * 12;
    const geo = new THREE.ConeGeometry(r, h, 14, 7, true);
    const p = geo.attributes.position;
    const colors = [];
    const c = new THREE.Color();
    for (let k = 0; k < p.count; k++) {
      const vx = p.getX(k), vy = p.getY(k), vz = p.getZ(k);
      const t = (vy + h / 2) / h, n = noise3(vx, vy, vz);
      if (t < 0.999) {
        const s = 1 + (n - 0.5) * 0.35;
        p.setXYZ(k, vx * s, vy + (noise3(vz, vx, vy) - 0.5) * h * 0.04, vz * s);
      }
      if (t > 0.7 + n * 0.1) c.set(0xf4f6f8);
      else if (t < 0.1) c.setHSL(0.25, 0.3, 0.25 + n * 0.05);
      else c.setHSL(0.08, 0.06, 0.33 + n * 0.12);
      colors.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    scene.add(mesh(geo, std(0xffffff, { vertexColors: true, flatShading: true }), x, h / 2, z));
    circles.push({ x, z, r: r * 0.9 });
  }
}

// ================= Wald und Felsen =================
const freeSpot = (x, z) =>
  !(Math.abs(z) < 26 || Math.abs(x) < 6 ||                       // Berge und Weg
    (Math.abs(x) < 18 && Math.abs(Math.abs(z) - 80) < 18) ||        // Burgen
    (Math.abs(x) < 18 && z > -70 && z < -40) ||                     // Platz vor der feindlichen Burg
    (Math.abs(x) < 10 && z > 55 && z < 70));                        // Platz vor eurer Burg
{
  const trees = [];
  for (let n = 0; n < 400 && trees.length < 260; n++) {
    const x = (rand() - 0.5) * 280, z = (rand() - 0.5) * 280;
    if (!freeSpot(x, z)) continue;
    const s = 0.8 + rand() * 0.6;
    trees.push({ x, z, s });
    circles.push({ x, z, r: 0.5 * s });
  }
  const N = trees.length;
  const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.35, 2.4, 7), std(0x5b3d26), N);
  const leafGeos = [new THREE.ConeGeometry(2.2, 3, 9), new THREE.ConeGeometry(1.7, 2.6, 9), new THREE.ConeGeometry(1.1, 2.2, 9)];
  const leafY = [3.0, 4.4, 5.6];
  const leaves = leafGeos.map((g) => new THREE.InstancedMesh(g, std(0xffffff, { flatShading: true }), N));
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0), col = new THREE.Color();
  trees.forEach((t, i) => {
    q.setFromAxisAngle(up, rand() * 6.28);
    sc.setScalar(t.s);
    trunks.setMatrixAt(i, m4.compose(pos.set(t.x, 1.2 * t.s, t.z), q, sc));
    col.setHSL(0.29 + rand() * 0.06, 0.45 + rand() * 0.15, 0.17 + rand() * 0.08);
    leaves.forEach((li, j) => {
      li.setMatrixAt(i, m4.compose(pos.set(t.x, leafY[j] * t.s, t.z), q, sc));
      li.setColorAt(i, col);
    });
  });
  for (const im of [trunks, ...leaves]) { im.castShadow = true; im.receiveShadow = true; scene.add(im); }

  const rocks = [];
  for (let n = 0; n < 200 && rocks.length < 70; n++) {
    const x = (rand() - 0.5) * 280, z = (rand() - 0.5) * 280;
    if (freeSpot(x, z)) rocks.push({ x, z, s: 0.3 + rand() * 1.0 });
  }
  const rockMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), std(0x8a8780, { flatShading: true }), rocks.length);
  rocks.forEach((r, i) => {
    q.setFromAxisAngle(up, rand() * 6.28);
    sc.set(r.s * (0.8 + rand() * 0.5), r.s * (0.5 + rand() * 0.3), r.s * (0.8 + rand() * 0.5));
    rockMesh.setMatrixAt(i, m4.compose(pos.set(r.x, r.s * 0.2, r.z), q, sc));
    if (r.s > 0.6) circles.push({ x: r.x, z: r.z, r: r.s * 0.9 });
  });
  rockMesh.castShadow = true; rockMesh.receiveShadow = true;
  scene.add(rockMesh);
}

// ================= Menschen (Bauern und Wachen) =================
const geos = {
  leg: new THREE.CapsuleGeometry(0.085, 0.62, 4, 8),
  boot: new THREE.BoxGeometry(0.17, 0.14, 0.3),
  torso: new THREE.CylinderGeometry(0.25, 0.2, 0.62, 12),
  skirt: new THREE.CylinderGeometry(0.22, 0.3, 0.32, 12),
  belt: new THREE.CylinderGeometry(0.225, 0.225, 0.06, 12),
  neck: new THREE.CylinderGeometry(0.06, 0.07, 0.12, 8),
  head: new THREE.SphereGeometry(0.15, 16, 12),
  eye: new THREE.SphereGeometry(0.022, 6, 6),
  nose: new THREE.SphereGeometry(0.03, 6, 6),
  hair: new THREE.SphereGeometry(0.162, 14, 10, 0, Math.PI * 2, 0, Math.PI * 0.55),
  arm: new THREE.CapsuleGeometry(0.065, 0.46, 4, 8),
  hand: new THREE.SphereGeometry(0.07, 8, 8),
};
const eyeMat = std(0x222222);

function makeHuman(o) {
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);
  const mats = {
    skin: std(0xe0ac80), shirt: std(o.shirt), pants: std(o.pants),
    boots: std(0x3b2a1e), belt: std(0x4a3020), hair: std(o.hair),
  };
  const legs = [];
  for (const s of [-1, 1]) {
    const hip = new THREE.Group();
    hip.position.set(s * 0.11, 0.92, 0);
    hip.add(mesh(geos.leg, mats.pants, 0, -0.42, 0));
    hip.add(mesh(geos.boot, mats.boots, 0, -0.85, 0.05));
    body.add(hip);
    legs.push(hip);
  }
  const torso = mesh(geos.torso, mats.shirt, 0, 1.27, 0);
  torso.scale.z = 0.75;
  const skirt = mesh(geos.skirt, mats.shirt, 0, 0.88, 0);
  skirt.scale.z = 0.8;
  const belt = mesh(geos.belt, mats.belt, 0, 1.0, 0);
  belt.scale.z = 0.78;
  body.add(torso, skirt, belt, mesh(geos.neck, mats.skin, 0, 1.62, 0));
  const head = mesh(geos.head, mats.skin, 0, 1.78, 0);
  head.scale.y = 1.1;
  body.add(head, mesh(geos.eye, eyeMat, -0.055, 1.8, 0.135), mesh(geos.eye, eyeMat, 0.055, 1.8, 0.135),
           mesh(geos.nose, mats.skin, 0, 1.76, 0.15));
  const hair = mesh(geos.hair, mats.hair, 0, 1.8, -0.01);
  hair.rotation.x = -0.35;
  body.add(hair);
  const arms = [];
  for (const s of [-1, 1]) {
    const sh = new THREE.Group();
    sh.position.set(s * 0.3, 1.52, 0);
    sh.add(mesh(geos.arm, mats.shirt, 0, -0.27, 0));
    sh.add(mesh(geos.hand, mats.skin, 0, -0.58, 0));
    body.add(sh);
    arms.push(sh);
  }
  if (o.strawHat) {
    const straw = std(0xd9b45a);
    body.add(mesh(new THREE.CylinderGeometry(0.34, 0.36, 0.03, 18), straw, 0, 1.93, 0));
    body.add(mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.15, 14), straw, 0, 2.01, 0));
    body.add(mesh(new THREE.CylinderGeometry(0.162, 0.162, 0.035, 14), std(o.band), 0, 1.96, 0));
  }
  if (o.helmet) {
    const steel = metal(0x9aa0a6);
    body.add(mesh(new THREE.SphereGeometry(0.175, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), steel, 0, 1.83, 0));
    body.add(mesh(new THREE.BoxGeometry(0.03, 0.12, 0.03), steel, 0, 1.79, 0.17));
  }
  // Waffe in der rechten Hand
  const weapon = new THREE.Group();
  weapon.position.set(0, -0.58, 0);
  arms[1].add(weapon);
  if (o.weapon === 'fork') {
    const wood = std(0x8d6e4a), iron = metal(0x777777);
    const shaft = mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.9, 6), wood, 0, 0, 0.35);
    shaft.rotation.x = Math.PI / 2;
    weapon.add(shaft);
    const bar = mesh(new THREE.BoxGeometry(0.32, 0.03, 0.03), iron, 0, 0, 1.3);
    weapon.add(bar);
    for (const fx of [-0.14, 0, 0.14]) {
      const tine = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.4, 5), iron, fx, 0, 1.5);
      tine.rotation.x = Math.PI / 2;
      weapon.add(tine);
    }
  } else if (o.weapon === 'sword') {
    weapon.add(mesh(new THREE.BoxGeometry(0.05, 0.1, 0.9), metal(0xd0d4d8), 0, 0, 0.55));
    weapon.add(mesh(new THREE.BoxGeometry(0.3, 0.05, 0.05), metal(0x8a6d2f), 0, 0, 0.08));
    const shield = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 20), std(o.shirt), 0.05, -0.38, 0.12);
    shield.rotation.x = Math.PI / 2;
    shield.rotation.z = 0.2;
    arms[0].add(shield);
    arms[0].add(mesh(new THREE.SphereGeometry(0.06, 8, 8), metal(0xbbbbbb), 0.05, -0.38, 0.16));
  }
  // Alle Materialien sammeln, damit die Figur bei Treffern aufleuchten kann
  const allMats = new Set();
  root.traverse((m) => { if (m.material && m.material !== eyeMat) allMats.add(m.material); });
  return { root, body, legs, arms, weapon, mats, allMats: [...allMats] };
}

function animateHuman(h, phase, moving, armR) {
  const swing = moving ? Math.sin(phase) : 0;
  h.legs[0].rotation.x = swing * 0.7;
  h.legs[1].rotation.x = -swing * 0.7;
  h.arms[0].rotation.x = -swing * 0.5;
  h.arms[1].rotation.x = armR + (moving ? swing * 0.25 : 0);
  h.body.position.y = moving ? Math.abs(Math.sin(phase)) * 0.05 : 0;
}

function flash(h, color) {
  for (const m of h.allMats) m.emissive.setHex(color);
}

// ================= Schwebende Anzeigen (Lebensleiste, Zahlen) =================
function makeBar() {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 10;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(1.1, 0.17, 1);
  sp.position.y = 2.35;
  sp.renderOrder = 10;
  sp.userData = { cv, tex };
  return sp;
}
function drawBar(sp, frac) {
  const { cv, tex } = sp.userData;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, 64, 10);
  ctx.fillStyle = frac > 0.5 ? '#3ecf4a' : frac > 0.25 ? '#f2c230' : '#e53935';
  ctx.fillRect(2, 2, 60 * Math.max(0, frac), 6);
  tex.needsUpdate = true;
}

const floaters = [];
function floatText(text, color, pos) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 96;
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 64px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 8;
  ctx.strokeStyle = '#000';
  ctx.strokeText(text, 128, 70);
  ctx.fillStyle = color;
  ctx.fillText(text, 128, 70);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sp.scale.set(1.6, 0.6, 1);
  sp.position.set(pos.x + (Math.random() - 0.5) * 0.6, 2.6, pos.z);
  sp.renderOrder = 11;
  scene.add(sp);
  floaters.push({ sp, t: 0 });
}

// ================= Töne =================
let actx;
function beep(freq, dur, type = 'square', vol = 0.06, slide = 0, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  swing: () => beep(500, 0.12, 'triangle', 0.04, 200),
  hit: () => beep(200, 0.12, 'square', 0.07, 70),
  hurt: () => beep(140, 0.3, 'sawtooth', 0.07, 50),
  windup: () => beep(300, 0.25, 'sine', 0.03, 600),
  levelUp: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, 'square', 0.05, 0, i * 0.12)),
};

// ================= Anzeige =================
const $ = (id) => document.getElementById(id);
let msgTimer;
function showMsg(text) {
  $('msg').textContent = text;
  $('msg').style.opacity = 1;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => ($('msg').style.opacity = 0), 2500);
}

// ================= Spieler =================
const RANKS = ['Bauer', 'Ritter', 'Schmied', 'Landherr', 'König', 'Kaiser', 'Militär'];
const RANK_COLORS = [0x8b6b3d, 0xa8b0b8, 0x4a4a4a, 0x2e7d32, 0x6a1b9a, 0xd4af37, 0x556b2f];
const team = { kills: 0, rank: 0 };

const players = [
  { keys: { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', attack: ['Space'] },
    look: { pants: 0x5a4a32, hair: 0x3a2414, band: 0x1e63d6 }, startX: -2.5 },
  { keys: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', attack: ['Enter', 'NumpadEnter', 'ShiftRight', 'ControlRight'] },
    look: { pants: 0x4a3a2a, hair: 0xd9b36a, band: 0xef6c00 }, startX: 2.5 },
];
players.forEach((p, i) => {
  p.index = i;
  p.h = makeHuman({ shirt: RANK_COLORS[0], ...p.look, strawHat: true, weapon: 'fork' });
  scene.add(p.h.root);
  p.bar = makeBar();
  p.h.root.add(p.bar);
  p.cam = new THREE.PerspectiveCamera(60, 1, 0.1, 500);
  p.hud = $('hud' + i);
  p.hurtEl = $('hurt' + i);
  p.walk = 0;
  respawn(p);
});

function respawn(p) {
  p.h.root.position.set(HOME.x + p.startX, 0, HOME.z - 16);
  p.h.body.rotation.x = 0;
  p.heading = Math.PI;
  p.hp = 100;
  p.dead = 0;
  p.attackT = 0;
  p.cooldown = 0;
  p.hurt = 0;
  p.camInit = false;
  updatePlayerHud(p);
}

function updatePlayerHud(p) {
  const hp = Math.max(0, Math.round(p.hp));
  const fill = p.hud.querySelector('.fill');
  fill.style.width = hp + '%';
  fill.style.background = hp > 50 ? '#3ecf4a' : hp > 25 ? '#f2c230' : '#e53935';
  p.hud.querySelector('.hpnum').textContent = hp + ' / 100';
  drawBar(p.bar, hp / 100);
}

function hurtPlayer(p, dmg) {
  if (p.dead > 0) return;
  p.hp -= dmg;
  p.hurt = 0.25;
  flash(p.h, 0xaa0000);
  floatText('-' + dmg, '#ff5252', p.h.root.position);
  sfx.hurt();
  p.hurtEl.style.opacity = 1;
  setTimeout(() => (p.hurtEl.style.opacity = 0), 250);
  const bar = p.hud.querySelector('.bar');
  bar.classList.remove('shake');
  void bar.offsetWidth;
  bar.classList.add('shake');
  if (p.hp <= 0) {
    p.hp = 0;
    p.dead = 3;
    showMsg('Spieler ' + (p.index + 1) + ' ist umgefallen! Gleich geht es in der Burg weiter.');
  }
  updatePlayerHud(p);
}

// ================= Gegner =================
const SPAWNS = [[-8, -60], [8, -60], [-4, -52], [4, -52], [-12, -46], [12, -46]];
const ENEMY_HP = 30;
const enemies = [];
function spawnEnemy(slot) {
  const h = makeHuman({ shirt: 0xb71c1c, pants: 0x3a3a3a, hair: 0x2b1b10, helmet: true, weapon: 'sword' });
  const [x, z] = SPAWNS[slot];
  h.root.position.set(x, 0, z);
  h.root.rotation.y = 0;
  const bar = makeBar();
  h.root.add(bar);
  drawBar(bar, 1);
  scene.add(h.root);
  enemies.push({ h, bar, hp: ENEMY_HP, home: { x, z }, slot, wind: 0, strike: 0, cd: 0, hit: 0, dying: 0, walk: 0, lastHit: null });
}
SPAWNS.forEach((_, i) => spawnEnemy(i));

function nearestPlayer(pos, maxDist) {
  let best = null, bestD = maxDist;
  for (const p of players) {
    if (p.dead > 0) continue;
    const d = p.h.root.position.distanceTo(pos);
    if (d < bestD) { best = p; bestD = d; }
  }
  return best;
}

function attack(p) {
  p.attackT = 0.35;
  p.cooldown = 0.45;
  sfx.swing();
  const pos = p.h.root.position;
  // Zielhilfe: zum nächsten Gegner in der Nähe drehen
  let target = null, td = 4.5;
  for (const e of enemies) {
    if (e.dying) continue;
    const d = e.h.root.position.distanceTo(pos);
    if (d < td) { target = e; td = d; }
  }
  if (target) p.heading = Math.atan2(target.h.root.position.x - pos.x, target.h.root.position.z - pos.z);
  const fx = Math.sin(p.heading), fz = Math.cos(p.heading);
  for (const e of enemies) {
    if (e.dying) continue;
    const dx = e.h.root.position.x - pos.x, dz = e.h.root.position.z - pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 3.6 && (dx * fx + dz * fz) / dist > 0.2) hitEnemy(e, p, fx, fz);
  }
}

function hitEnemy(e, p, fx, fz) {
  const now = performance.now();
  const teamwork = e.lastHit && e.lastHit.by !== p && now - e.lastHit.time < 1500;
  const dmg = teamwork ? 20 : 10;
  e.lastHit = { by: p, time: now };
  e.hp -= dmg;
  e.hit = 0.15;
  e.wind = 0;            // Treffer unterbricht den Schwerthieb
  e.cd = Math.max(e.cd, 0.8);
  flash(e.h, 0xffffff);
  floatText(teamwork ? 'TEAM! -' + dmg : '-' + dmg, teamwork ? '#ffd54f' : '#ffffff', e.h.root.position);
  sfx.hit();
  move(e.h.root, fx * 1.2, fz * 1.2, 0.5);
  drawBar(e.bar, e.hp / ENEMY_HP);
  if (e.hp <= 0) defeat(e);
}

function defeat(e) {
  e.dying = 1;
  e.bar.visible = false;
  team.kills++;
  const newRank = Math.min(Math.floor(team.kills / 3), RANKS.length - 1);
  if (newRank > team.rank) {
    team.rank = newRank;
    players.forEach((p, i) => {
      p.h.mats.shirt.color.setHex(RANK_COLORS[newRank]);
      if (i === 1) p.h.mats.shirt.color.offsetHSL(0, 0, 0.08);
    });
    showMsg('Ihr seid jetzt ' + RANKS[newRank] + '!');
    sfx.levelUp();
  }
  $('rank').textContent = RANKS[team.rank];
  $('kills').textContent = team.kills;
  setTimeout(() => spawnEnemy(e.slot), 6000);
}

// ================= Tastatur =================
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (!actx) actx = new AudioContext();
  if (e.code.startsWith('Arrow') || e.code === 'Space' || e.code === 'Enter') e.preventDefault();
});
addEventListener('keyup', (e) => (keys[e.code] = false));

// ================= Spielschleife =================
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();

function updatePlayer(p, dt) {
  const root = p.h.root;
  let moving = false;
  if (p.dead > 0) {
    p.dead -= dt;
    p.h.body.rotation.x = Math.max(-Math.PI / 2, p.h.body.rotation.x - dt * 4);
    if (p.dead <= 0) respawn(p);
  } else {
    const k = p.keys;
    if (keys[k.left]) p.heading += 2.6 * dt;
    if (keys[k.right]) p.heading -= 2.6 * dt;
    let speed = 0;
    if (keys[k.up]) speed = 9;
    if (keys[k.down]) speed = -5;
    if (speed) {
      move(root, Math.sin(p.heading) * speed * dt, Math.cos(p.heading) * speed * dt, 0.5);
      p.walk += dt * (speed > 0 ? 11 : -8);
      moving = true;
    }
    p.cooldown -= dt;
    if (k.attack.some((c) => keys[c]) && p.cooldown <= 0) attack(p);
    if (p.hp < 100) { p.hp = Math.min(100, p.hp + dt); updatePlayerHud(p); }
  }
  root.rotation.y = p.heading;

  // Mistgabel nach vorne stoßen
  p.attackT = Math.max(0, p.attackT - dt);
  const thrust = p.attackT > 0 ? Math.sin((1 - p.attackT / 0.35) * Math.PI) : 0;
  const armR = -0.35 - thrust * 1.1;
  animateHuman(p.h, p.walk, moving, armR);
  p.h.weapon.rotation.x = -armR - 0.25;
  p.h.weapon.position.z = thrust * 0.4;

  if (p.hurt > 0) { p.hurt -= dt; if (p.hurt <= 0) flash(p.h, 0); }

  // Kamera hinter dem Spieler, aber nie in einer Mauer oder einem Berg
  const fx = Math.sin(p.heading), fz = Math.cos(p.heading);
  let camDist = 7;
  for (let d = 1; d <= 7; d += 0.5) {
    if (blocked(root.position.x - fx * d, root.position.z - fz * d, 0.3)) { camDist = Math.max(1.5, d - 1); break; }
  }
  camPos.set(root.position.x - fx * camDist, 3.8, root.position.z - fz * camDist);
  camLook.set(root.position.x + fx * 3, 1.6, root.position.z + fz * 3);
  if (!p.camInit) { p.cam.position.copy(camPos); p.camInit = true; }
  p.cam.position.lerp(camPos, 0.12);
  p.cam.lookAt(camLook);
}

function updateEnemy(e, dt) {
  const root = e.h.root;
  if (e.dying) {
    e.dying -= dt;
    e.h.body.rotation.x = Math.max(-Math.PI / 2, e.h.body.rotation.x - dt * 5);
    if (e.dying < 0.3) root.position.y -= dt * 3;
    if (e.dying <= 0) { scene.remove(root); enemies.splice(enemies.indexOf(e), 1); }
    return;
  }
  let moving = false;
  const target = nearestPlayer(root.position, 22);
  e.cd -= dt;
  if (target) {
    const tp = target.h.root.position;
    const dx = tp.x - root.position.x, dz = tp.z - root.position.z;
    const dist = Math.hypot(dx, dz);
    root.rotation.y = Math.atan2(dx, dz);
    if (e.wind > 0) {
      // Schwert hoch ... und zuschlagen!
      e.wind -= dt;
      if (e.wind <= 0) {
        e.strike = 0.15;
        if (dist < 2.8) hurtPlayer(target, 8);
      }
    } else if (dist < 2.2 && e.cd <= 0) {
      e.wind = 0.6;
      e.cd = 1.8;
      sfx.windup();
    } else if (dist > 1.8 && e.strike <= 0) {
      move(root, (dx / dist) * 5 * dt, (dz / dist) * 5 * dt, 0.5);
      moving = true;
    }
  } else {
    const dx = e.home.x - root.position.x, dz = e.home.z - root.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1) {
      move(root, (dx / dist) * 4 * dt, (dz / dist) * 4 * dt, 0.5);
      root.rotation.y = Math.atan2(dx, dz);
      moving = true;
    }
    e.wind = 0;
  }
  if (moving) e.walk += dt * 9;

  let armR = -0.3;
  if (e.wind > 0) armR = -0.3 - (1 - e.wind / 0.6) * 2.3;
  else if (e.strike > 0) { armR = -0.4 - (e.strike / 0.15) * 2.2; e.strike -= dt; }
  animateHuman(e.h, e.walk, moving, armR);
  e.h.arms[0].rotation.x = -0.6;   // Schild vor dem Körper

  if (e.hit > 0) { e.hit -= dt; if (e.hit <= 0) flash(e.h, 0); }
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  players.forEach((p) => updatePlayer(p, dt));
  [...enemies].forEach((e) => updateEnemy(e, dt));
  for (const f of [...floaters]) {
    f.t += dt;
    f.sp.position.y += dt * 1.3;
    f.sp.material.opacity = 1 - f.t;
    if (f.t >= 1) {
      scene.remove(f.sp);
      f.sp.material.map.dispose();
      f.sp.material.dispose();
      floaters.splice(floaters.indexOf(f), 1);
    }
  }

  // Geteilter Bildschirm: links Spieler 1, rechts Spieler 2
  const w = innerWidth, h = innerHeight, half = Math.floor(w / 2);
  renderer.setScissorTest(true);
  players.forEach((p, i) => {
    renderer.setViewport(i * half, 0, half, h);
    renderer.setScissor(i * half, 0, half, h);
    p.cam.aspect = half / h;
    p.cam.updateProjectionMatrix();
    renderer.render(scene, p.cam);
  });
  requestAnimationFrame(tick);
}
window.game = { players, enemies, team };   // zum Ausprobieren in der Browser-Konsole
showMsg('Zwei Bauern gegen die rote Burg. Helft euch gegenseitig!');
tick();
</script>
