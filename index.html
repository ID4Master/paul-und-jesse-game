<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul und Jesse Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  .hud { position: fixed; top: 12px; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .hud .name { font-size: 20px; font-weight: bold; }
  .hud .keys { display: block; font-size: 12px; font-weight: normal; opacity: .85; }
  .bar { position: relative; width: 240px; height: 20px; margin-top: 4px; background: #000a; border: 2px solid #fff; border-radius: 6px; overflow: hidden; }
  .fill { position: absolute; inset: 0; width: 100%; background: #3ecf4a; transition: width .15s, background .3s; }
  .hpnum { position: absolute; inset: 0; text-align: center; font-size: 14px; font-weight: bold; line-height: 20px; }
  .info { margin-top: 3px; font-size: 16px; }
  .info .level { font-weight: bold; }
  .info.small { font-size: 13px; opacity: .9; }
  .shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }
  .half { position: fixed; top: 0; bottom: 0; width: 50%; pointer-events: none; }
  .hurt { opacity: 0; transition: opacity .35s; background: radial-gradient(ellipse at center, transparent 45%, rgba(220,0,0,.75) 100%); }
  .wait { display: none; background: #0008; color: #fff; font-size: 28px; font-weight: bold; text-align: center;
          align-items: center; justify-content: center; text-shadow: 0 2px 6px #000; padding: 0 20px; box-sizing: border-box; }
  .pmsg { position: fixed; top: 34%; width: 50%; text-align: center; color: #fff; font-size: 30px; font-weight: bold;
          text-shadow: 0 2px 6px #000; pointer-events: none; opacity: 0; transition: opacity .4s; padding: 0 16px; box-sizing: border-box; }
  #divider { position: fixed; top: 0; bottom: 0; left: calc(50% - 2px); width: 4px; background: #222; }
  #msg { position: fixed; top: 20%; width: 100%; text-align: center; color: #ffd54f; font-size: 40px; font-weight: bold;
         text-shadow: 0 2px 8px #000; pointer-events: none; opacity: 0; transition: opacity .4s; }
</style>
</head>
<body>
<div class="half hurt" id="hurt0" style="left:0"></div>
<div class="half hurt" id="hurt1" style="left:50%"></div>
<div class="half wait" id="wait0" style="left:0"></div>
<div class="half wait" id="wait1" style="left:50%"></div>
<div id="divider"></div>

<div class="hud" id="hud0" style="left:12px">
  <div class="name">Spieler 1 <span class="keys">W A S D laufen · Leertaste angreifen · Q Waffe wechseln</span></div>
  <div class="bar"><div class="fill"></div><div class="hpnum"></div></div>
  <div class="info"><span class="level"></span> &nbsp; <span class="lives"></span></div>
  <div class="info"><span class="weapon"></span></div>
  <div class="info small xp"></div>
</div>
<div class="hud" id="hud1" style="left:calc(50% + 14px)">
  <div class="name">Spieler 2 <span class="keys">Pfeiltasten laufen · Enter angreifen · Shift rechts Waffe wechseln</span></div>
  <div class="bar"><div class="fill"></div><div class="hpnum"></div></div>
  <div class="info"><span class="level"></span> &nbsp; <span class="lives"></span></div>
  <div class="info"><span class="weapon"></span></div>
  <div class="info small xp"></div>
</div>

<div class="pmsg" id="msg0" style="left:0"></div>
<div class="pmsg" id="msg1" style="left:50%"></div>
<div id="msg"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
